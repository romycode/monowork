name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test (just + Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Create .env
        # compose.yml declares `env_file: .env`, which is gitignored and
        # absent on a fresh checkout. The api service reads DATABASE_URL and
        # OTEL_* from the compose `environment:` block, so an empty file is
        # enough to satisfy the requirement.
        run: touch .env

      - name: Build dev image
        run: just build

      - name: Install dependencies
        # The `development` image ships no node_modules; deps live in the
        # bind-mounted working tree (compose mounts `.:/monowork`). The
        # `just install` recipe uses `docker compose run -it`, whose TTY
        # request fails on the runner, so install directly instead. Runs as
        # root (the image default) so it can write into the checkout, which
        # is owned by a different uid than the container's `node` user.
        run: docker compose run --rm --no-deps api pnpm install --frozen-lockfile

      - name: Start services
        run: just start

      - name: Wait for containers
        # typecheck and test exec into the running api/app containers. Poll
        # until both accept `exec` before driving them.
        run: |
          for svc in api app; do
            ok=
            for i in $(seq 1 30); do
              if docker compose exec -T "$svc" true 2>/dev/null; then
                echo "$svc is ready"
                ok=1
                break
              fi
              echo "waiting for $svc... ($i)"
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$svc did not become ready in time"
              docker compose logs "$svc"
              exit 1
            fi
          done

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test

      - name: Stop services
        if: always()
        run: just stop
