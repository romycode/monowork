name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test (just + Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Create .env
        # compose.yml declares `env_file: .env`, which is gitignored and
        # absent on a fresh checkout. The api/app services read DATABASE_URL
        # and OTEL_* from the compose `environment:` block, so this file only
        # needs to (a) satisfy the env_file requirement and (b) disable
        # telemetry in CI. OTEL_SDK_DISABLED makes the OpenTelemetry SDK a
        # no-op (env_file values apply since `environment:` does not set it),
        # and the otel-lgtm observability stack is never started below.
        run: echo "OTEL_SDK_DISABLED=true" > .env

      - name: Build dev image
        run: just build

      - name: Install dependencies
        # The `development` image ships no node_modules; deps live in the
        # bind-mounted working tree (compose mounts `.:/monowork`). The
        # `just install` recipe uses `docker compose run -it`, whose TTY
        # request fails on the runner, so install directly instead. Runs as
        # root (the image default) so it can write into the checkout, which
        # is owned by a different uid than the container's `node` user.
        run: docker compose run --rm --no-deps api pnpm install --frozen-lockfile

      - name: Start services
        # Telemetry is disabled in CI: start only the services the test run
        # needs and skip the otel-lgtm observability stack. --no-deps stops
        # compose from pulling otel-lgtm in via the api service's depends_on.
        run: docker compose up -d --no-deps postgres api app

      - name: Wait for containers
        # typecheck and test exec into the running api/app containers. Poll
        # until both accept `exec` before driving them.
        run: |
          for svc in api app; do
            ok=
            for i in $(seq 1 30); do
              if docker compose exec -T "$svc" true 2>/dev/null; then
                echo "$svc is ready"
                ok=1
                break
              fi
              echo "waiting for $svc... ($i)"
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$svc did not become ready in time"
              docker compose logs "$svc"
              exit 1
            fi
          done

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test (unit + acceptance + app)
        # Skip the DB integration tests (users.repo.test.ts): they use
        # Testcontainers, which needs a Docker daemon the api container does
        # not have. These suites mock the repository (api) or run in jsdom
        # (app), so they need neither a database nor Docker-in-Docker.
        run: |
          just test-unit
          just test-acceptance
          just test-app

      - name: Stop services
        if: always()
        run: just stop
