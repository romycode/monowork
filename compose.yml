# Docker Compose v2 — no version field required (obsolete since Compose v2.27+)
services:
  ide:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    working_dir: /monowork
    volumes:
      - .:/monowork
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    init: true
    working_dir: /monowork/api
    command: pnpm --filter @monowork/api dev
    ports:
      - "7000:7000"
    volumes:
      - .:/monowork
    environment:
      NODE_ENV: development
      PORT: "7000"
      # @opentelemetry/instrumentation/hook.mjs must be the first --import so the OTel ESM
      # loader hook is registered before tsx (or anything else) loads CJS modules like pg.
      # Without this, pg is already in the module cache by the time sdk.start() runs and
      # PgInstrumentation cannot patch it.
      # DEP0205: register() deprecated in favour of registerHooks(), but import-in-the-middle
      # only ships async hooks which the sync-only registerHooks() API cannot accept.
      NODE_OPTIONS: "--disable-warning=DEP0205 --import @opentelemetry/instrumentation/hook.mjs"
      DATABASE_URL: "postgres://monowork:monowork@postgres:5432/monowork"
      OTEL_SERVICE_NAME: monowork-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      LOKI_ENDPOINT: http://otel-lgtm:3100
    depends_on:
      postgres:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:7000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    init: true
    working_dir: /monowork/app
    command: pnpm --filter @monowork/app dev
    ports:
      - "7001:7001"
    volumes:
      - .:/monowork
    environment:
      NODE_ENV: development
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:7001').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monowork
      POSTGRES_USER: monowork
      POSTGRES_PASSWORD: monowork
    ports:
      - "127.0.0.1:7002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monowork"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "7010:3000"   # Grafana
      - "7011:4317"   # OTLP gRPC
      - "7012:4318"   # OTLP HTTP
      - "7013:3200"   # Tempo
      - "7014:4040"   # Pyroscope
      - "7015:9090"   # Prometheus
    volumes:
      - otel_lgtm_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  otel_lgtm_data:
