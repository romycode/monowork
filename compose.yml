# Docker Compose v2 — no version field required (obsolete since Compose v2.27+)
services:
  api:
    image: node:26-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @monowork/api dev"
    ports:
      # Bind to localhost only — avoids exposing the dev port on all interfaces
      - "3000:3000"
    volumes:
      - .:/app
      # Named volumes prevent host node_modules from shadowing container installs
      - api_root_modules:/app/node_modules
      - api_pkg_modules:/app/api/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: "postgres://monowork:monowork@postgres:5432/monowork"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    image: node:26-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @monowork/app dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app_root_modules:/app/node_modules
      - app_pkg_modules:/app/app/node_modules
    environment:
      NODE_ENV: development
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monowork
      POSTGRES_USER: monowork
      POSTGRES_PASSWORD: monowork
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monowork"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api_root_modules:
  api_pkg_modules:
  app_root_modules:
  app_pkg_modules:
  postgres_data:
